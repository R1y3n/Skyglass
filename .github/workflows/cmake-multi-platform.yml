build-arm:
    name: Build (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target_name: aarch64
            distro: ubuntu22.04
          - arch: armv7
            target_name: armhf
            distro: ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build Skyglass under QEMU
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y gcc libx11-dev libxext-dev make
          run: |
            make CC="gcc" CFLAGS="-O2"
            mv skyglass skyglass-${{ matrix.target_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyglass-${{ matrix.target_name }}
          path: skyglass-${{ matrix.target_name }}
